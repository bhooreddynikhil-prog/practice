<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Employee Details</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Position</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Rahul Sharma</td>
            <td>IT</td>
            <td>Developer</td>
            <td>₹50,000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Anjali Verma</td>
            <td>HR</td>
            <td>Manager</td>
            <td>₹45,000</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Suresh Kumar</td>
            <td>Finance</td>
            <td>Accountant</td>
            <td>₹40,000</td>
        </tr>
    </table>

</body>
</html>
